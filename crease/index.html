<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Crease: fold the page, roll the ball</title>
  <meta name="description" content="A friend sent you a Crease page. Open it in Crease and fold the page to reach the star.">
  <meta property="og:title" content="Crease">
  <meta property="og:description" content="A friend sent you a page. Fold the page, roll the ball, reach the star.">
  <meta property="og:image" content="https://valleyrunapp.com/crease/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #22283A; --red: #E5484D; --paper: #F5F7FB; --sun: #FFE96B; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Baloo 2", system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at 50% 35%, #2E3954, #1A2134 70%); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 440px; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 34px 26px 26px;
      position: relative; text-align: center; transform: rotate(-1deg); box-shadow: 0 10px 0 rgba(0,0,0,.3);
      background-image: repeating-linear-gradient(transparent 0 31px, #D3E0EF 31px 32px); }
    .tape { position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: rgba(255,233,107,.9); transform: rotate(-3deg); }
    img.icon { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    h1 { font-family: "Caveat", cursive; font-size: 54px; line-height: 1; margin: 16px 0 6px; color: var(--red); }
    .what { font-size: 19px; font-weight: 600; margin: 0 0 22px; }
    .race { display: inline-block; background: var(--sun); padding: 4px 14px; border-radius: 99px; font-weight: 800; margin-bottom: 18px; }
    a.btn { display: block; margin: 10px auto 0; max-width: 300px; padding: 13px 18px; border-radius: 99px; font-weight: 800; font-size: 19px; text-decoration: none; }
    a.open { background: var(--red); color: #fff; box-shadow: 0 5px 0 #B23237; }
    a.get { color: var(--ink); border: 2px solid rgba(34,40,58,.25); }
    p.small { font-size: 14px; opacity: .65; margin: 18px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tape"></div>
    <img class="icon" src="icon.png" alt="Crease app icon">
    <h1 id="title">Crease</h1>
    <p class="what" id="what">A friend sent you a page to fold.</p>
    <div class="race" id="race" hidden></div>
    <a class="btn open" id="open" href="#">Open in Crease</a>
    <a class="btn get" id="get" href="https://valleyrunapp.com/">Get Crease</a>
    <p class="small">Fold the page. Roll the ball. Reach the star. Made for iPhone, and folds with iPhone Duo.</p>
  </main>
  <script>
    (function () {
      var frag = (location.hash || "").replace(/^#/, "");
      var open = document.getElementById("open");
      if (!frag) { open.style.display = "none"; return; }
      var head = frag.split("&")[0];
      var params = {};
      frag.split("&").slice(1).forEach(function (kv) {
        var p = kv.split("="); params[p[0]] = decodeURIComponent((p[1] || "").replace(/\+/g, " "));
      });
      var what = document.getElementById("what"), title = document.getElementById("title");
      if (/^d\d+$/.test(head)) { what.textContent = "Today's Daily Fold, number " + head.slice(1) + "."; }
      else if (/^w\d+-\d+$/.test(head)) { var m = head.match(/^w(\d+)-(\d+)$/); what.textContent = "World " + m[1] + ", page " + m[2] + "."; }
      else { what.textContent = "A page your friend built."; }
      if (params.t) {
        var who = params.n || "Your friend";
        var folds = params.f === "1" ? "1 fold" : (params.f || "?") + " folds";
        title.textContent = "Race my ghost";
        var race = document.getElementById("race");
        race.textContent = who + ": " + folds + ", " + (Number(params.t) / 100).toFixed(2) + "s";
        race.hidden = false;
      }
      var app = "crease://open#" + frag;
      open.href = app;
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        setTimeout(function () { location.href = app; }, 300);
      }
    })();
  </script>
</body>
</html>
